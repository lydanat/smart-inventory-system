<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E1A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Top Face Gradient -->
    <linearGradient id="topFace" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.35" />
    </linearGradient>

    <!-- Left Face Gradient -->
    <linearGradient id="leftFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#042F2E" stop-opacity="0.6" />
    </linearGradient>

    <!-- Right Face Gradient -->
    <linearGradient id="rightFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#082F49" stop-opacity="0.6" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Ambient background glow behind cube -->
  <circle cx="256" cy="260" r="140" fill="#06B6D4" opacity="0.15" filter="url(#neonGlow)" />

  <!-- 3D Isometric Cube -->
  <g filter="url(#subtleGlow)">
    <!-- Top Face -->
    <polygon points="256,120 390,195 256,270 122,195" fill="url(#topFace)" stroke="#22D3EE" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Left Face -->
    <polygon points="122,195 256,270 256,410 122,335" fill="url(#leftFace)" stroke="#10B981" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Right Face -->
    <polygon points="256,270 390,195 390,335 256,410" fill="url(#rightFace)" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" />

    <!-- Isometric Circuit Traces & Lines (Left Face) -->
    <path d="M 150,230 L 210,264 L 210,340" fill="none" stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <circle cx="150" cy="230" r="4" fill="#6EE7B7" />
    <circle cx="210" cy="340" r="4" fill="#6EE7B7" />
    <path d="M 175,280 L 175,345 L 230,377" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <circle cx="230" cy="377" r="3.5" fill="#34D399" />

    <!-- Isometric Circuit Traces (Right Face) -->
    <path d="M 360,230 L 300,264 L 300,340" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <circle cx="360" cy="230" r="4" fill="#BAE6FD" />
    <circle cx="300" cy="340" r="4" fill="#BAE6FD" />
    <path d="M 335,280 L 335,345 L 280,377" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <circle cx="280" cy="377" r="3.5" fill="#38BDF8" />

    <!-- Isometric Circuit Traces (Top Face) -->
    <path d="M 200,165 L 256,197 L 312,165" fill="none" stroke="#67E8F9" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <circle cx="200" cy="165" r="3.5" fill="#A5F3FC" />
    <circle cx="312" cy="165" r="3.5" fill="#A5F3FC" />
  </g>

  <!-- Central Floating Smart Package / AI Core Badge -->
  <g transform="translate(256,270)">
    <!-- Glowing core halo -->
    <circle cx="0" cy="0" r="46" fill="#020617" stroke="#22D3EE" stroke-width="3" filter="url(#subtleGlow)" />
    
    <!-- Mini Isometric Box / Inventory Package Icon -->
    <path d="M 0,-24 L 20,-12 L 0,0 L -20,-12 Z" fill="#34D399" />
    <path d="M -20,-12 L 0,0 L 0,22 L -20,10 Z" fill="#059669" />
    <path d="M 0,0 L 20,-12 L 20,10 L 0,22 Z" fill="#0D9488" />
    <!-- Box seam / tape -->
    <path d="M -7,-16 L 0,-12 L 0,22" fill="none" stroke="#A7F3D0" stroke-width="2" />
  </g>

  <!-- AI Sparks (Top Right & Top Left) -->
  <!-- Top Right Main Spark -->
  <path d="M 390,135 Q 390,155 410,155 Q 390,155 390,175 Q 390,155 370,155 Q 390,155 390,135 Z" fill="#FFFFFF" filter="url(#neonGlow)" />
  <circle cx="390" cy="155" r="4" fill="#67E8F9" />

  <!-- Top Left Subtle Spark -->
  <path d="M 125,145 Q 125,160 140,160 Q 125,160 125,175 Q 125,160 110,160 Q 125,160 125,145 Z" fill="#34D399" opacity="0.85" filter="url(#subtleGlow)" />
</svg>